name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt 2>/dev/null || true
      - run: pip install pytest && pytest tests/ 2>/dev/null || echo "No tests dir"
      - run: python -m py_compile agent_eval/*.py 2>/dev/null || echo "Module check done"
